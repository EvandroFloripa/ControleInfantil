# Publica o painel dos pais em https://painelpais.ea-systems.dev.br (Hostinger).
#
# Roda quando algo em painel/ muda na branch principal, ou à mão (Actions → Run).
# Envia por FTPS só os arquivos que mudaram (o estado fica no servidor, em
# .ftp-deploy-sync-state.json).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    host do FTP da Hostinger (hPanel -> Contas FTP)
#   FTP_USERNAME  conta FTP restrita a public_html/painelpais
#   FTP_PASSWORD  senha dessa conta
name: Painel

on:
  push:
    branches: [claude/parental-control-app-5qy1gk]
    paths: ['painel/**', '.github/workflows/painel.yml']
  workflow_dispatch:

concurrency:
  group: painel-deploy
  cancel-in-progress: false   # não interrompe um envio no meio

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: painel
      url: https://painelpais.ea-systems.dev.br
    steps:
      - uses: actions/checkout@v7

      - name: Conferir secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Faltam FTP_SERVER, FTP_USERNAME ou FTP_PASSWORD."
            exit 1
          fi
          # Aceita o host como o hPanel mostra ("ftp://1.2.3.4", com porta ou
          # espaços): a action quer só o nome/IP.
          host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "::add-mask::$host"
          if printf '%s' "$host" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "FTP_SERVER: IP (${#host} caracteres)"
          else
            echo "FTP_SERVER: nome (${#host} caracteres); resolve? $(getent hosts "$host" >/dev/null && echo sim || echo NAO)"
          fi
          echo "FTP_HOST=$host" >> "$GITHUB_ENV"

      - name: Enviar para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./painel/
          # A conta FTP já começa em public_html/painelpais.
          server-dir: ./

      - name: Conferir o site
        run: |
          # O site tem de servir exatamente o index.html deste commit: se a conta
          # FTP apontar para outra pasta, o envio "dá certo" mas nada muda no site.
          site=https://painelpais.ea-systems.dev.br
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS "$site/index.html?v=$GITHUB_SHA-$i" | sha256sum | cut -d' ' -f1)
            [ "$live" = "$(sha256sum painel/index.html | cut -d' ' -f1)" ] && break
            sleep 10
          done
          if [ "$live" != "$(sha256sum painel/index.html | cut -d' ' -f1)" ]; then
            echo "::error::O site não serve o index.html deste commit. A conta FTP deve estar apontando para outra pasta que não public_html/painelpais do ea-systems.dev.br."
            exit 1
          fi
          # E mantém o bloqueio contra ser embutido em outro site.
          curl -fsSI "$site/" | grep -qi "x-frame-options: DENY"
          echo "Painel no ar com a versão deste commit."
