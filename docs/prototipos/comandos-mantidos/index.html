<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protótipo — Comandos mantidos (dados fictícios)</title>
<style>
  :root { --ink:#142538; --muted:#5d6e80; --border:#dce5ec; --surface:#fff; --soft:#f6f9fb;
    --primary:#0a7c76; --primary-dark:#075a58; --accent:#42c8b5; --warn:#8a520a; --warn-bg:#fff6e6;
    --danger:#b83f50; --danger-bg:#fbe9ec; --ok-bg:#e3f6f2; --focus:#63e0cf; --radius:16px; --radius-sm:11px; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; color:var(--ink); background:#eef3f7; overflow-x:hidden; }
  button { font: inherit; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .proto-bar { background:#1f2d3a; color:#dbe6ee; padding:10px 16px; font-size:13px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .proto-bar b { margin-right:6px; }
  header.top { max-width:1100px; margin:0 auto; padding:22px 16px 6px; }
  header.top h1 { margin:0; font-size:22px; }
  header.top p { margin:6px 0 0; color:var(--muted); font-size:14px; line-height:1.5; }
  .grid { max-width:1100px; margin:0 auto; padding:14px 16px 60px; display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow: 0 10px 26px rgba(25,50,70,.08); display:flex; flex-direction:column; gap:10px; min-width:0; }
  .card.nao { border-style:dashed; background:#fbfcfd; }
  .card h2 { margin:0; font-size:16px; }
  .desc { margin:0; color:var(--muted); font-size:13px; line-height:1.45; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { font-size:11px; font-weight:800; border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .tag.existe { background:var(--ok-bg); color:var(--primary-dark); }
  .tag.novo { background:var(--warn-bg); color:var(--warn); }
  .tag.nao { background:var(--danger-bg); color:var(--danger); }
  .sub { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:800; color:var(--muted); margin-top:4px; }
  .panel-mock { background:var(--soft); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; display:flex; flex-direction:column; gap:8px; }
  .btn { background:var(--primary); color:#fff; border:0; border-radius:9px; padding:9px 12px; font-weight:700; cursor:pointer; font-size:13px; }
  .btn.danger { background:var(--danger); }
  .btn.ghost { background:#fff; color:var(--primary); border:1px solid var(--border); }
  .muted { color:var(--muted); font-size:12px; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:13px; }
  .kid-mock { background: linear-gradient(160deg,#2d6f8f,#17384d); color:#fff; border-radius:var(--radius-sm); padding:12px; font-size:13px; line-height:1.45; }
  .kid-mock .banner { background: rgba(255,255,255,.18); border-radius:10px; padding:9px 10px; margin-top:6px; }
  .kid-label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; opacity:.75; }
  .notif { background: rgba(255,255,255,.92); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin-top: 6px; font-size: 12px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .log { font-size:12px; border-top:1px solid #e6edf2; padding:6px 0; }
  .log span { color: var(--muted); }
  .nao-box { border:1px dashed #c9d6df; border-radius:var(--radius-sm); padding:14px; color:var(--muted); font-size:13px; line-height:1.5; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div class="proto-bar" role="group" aria-label="Controles do protótipo"><b>Protótipo · dados fictícios</b> Cada cartão mostra a tela do responsável e o que a criança vê.</div>

<header class="top">
  <h1>Comandos mantidos — proposta visual</h1>
  <p>Só os comandos que são viáveis no Android. O conteúdo de mensagens não aparece aqui: fica fora, por privacidade e por limite da Play Store.</p>
</header>

<main class="grid" id="grid"></main>

<script>
const CARTOES = [
  { id:'bloquear', tag:'existe', tagTxt:'Já existe', titulo:'Bloquear a tela',
    desc:'Bloqueia o aparelho na hora. A criança precisa do PIN ou do desbloqueio do responsável.',
    painel:`<button class="btn danger" type="button">🔒 Bloquear tela agora</button><p class="muted" style="margin:0">Sem confirmação extra: é um bloqueio imediato.</p>`,
    crianca:`<div class="kid-label">Tela</div><div class="banner">🔒 O aparelho foi bloqueado pelo seu responsável.</div>` },
  { id:'reiniciar', tag:'existe', tagTxt:'Já existe', titulo:'Reiniciar',
    desc:'Reinicia o aparelho. Pede confirmação no painel antes de enviar.',
    painel:`<button class="btn" type="button">🔁 Reiniciar aparelho</button><p class="muted" style="margin:0">Confirmação: “Reiniciar o aparelho agora?”</p>`,
    crianca:`<div class="kid-label">Sistema</div><div class="banner">O aparelho vai reiniciar em instantes.</div>` },
  { id:'acordar', tag:'novo', tagTxt:'Novo', titulo:'Acordar a tela',
    desc:'Liga a tela de um aparelho que já está ligado, quando ele está com a tela apagada. Não liga um aparelho desligado.',
    painel:`<button class="btn" type="button">💡 Acordar a tela</button><p class="muted" style="margin:0">Só funciona se o aparelho estiver ligado e com o app ativo.</p>`,
    crianca:`<div class="kid-label">Tela</div><p class="muted" style="color:#dbe6ee;margin:0">A tela acende. Nenhum aviso extra.</p>` },
  { id:'ver', tag:'existe', tagTxt:'Já existe', titulo:'Ver a tela',
    desc:'Mostra a tela do aparelho em tempo real. O Android pede um toque de confirmação da criança.',
    painel:`<button class="btn" type="button">🖥️ Ver a tela</button><p class="muted" style="margin:0">A visualização abre numa janela sobre o painel.</p>`,
    crianca:`<div class="kid-label">Só na notificação</div><div class="notif">Controle Infantil · Seu responsável está vendo a sua tela.</div>` },
  { id:'camera', tag:'existe', tagTxt:'Já existe', titulo:'Câmera e som (check-in)',
    desc:'Liga câmera e microfone para o responsável ver e ouvir. Mostra aviso permanente na criança enquanto durar.',
    painel:`<button class="btn" type="button">🎥 Ver e ouvir (check-in)</button><p class="muted" style="margin:0">A bolinha do Android fica ativa enquanto durar.</p>`,
    crianca:`<div class="kid-label">Só na notificação</div><div class="notif">Controle Infantil · Câmera e microfone em uso pelo seu responsável.</div>` },
  { id:'mensagens', tag:'novo', tagTxt:'Novo · sem conteúdo', titulo:'Resumo de mensagens (sem conteúdo)',
    desc:'Mostra quais apps de mensagem e SMS foram usados e quando, sem ler o texto. O conteúdo não é lido.',
    painel:`<div class="log">19:42 · WhatsApp · 12 notificações <span>(conteúdo não lido)</span></div>
      <div class="log">18:10 · SMS · 3 mensagens <span>(conteúdo não lido)</span></div>`,
    crianca:`<div class="kid-label">Aviso visível</div><div class="banner">💬 Seu responsável vê quais apps de mensagem você usa e quando. O texto das conversas não é visto.</div>` },
];

const grid = document.getElementById('grid');
grid.innerHTML = CARTOES.map(c => `
  <article class="card" aria-labelledby="t-${c.id}">
    <h2 id="t-${c.id}">${c.titulo}</h2>
    <div class="tags"><span class="tag ${c.tag}">${c.tagTxt}</span></div>
    <p class="desc">${c.desc}</p>
    <div class="sub">Tela do responsável</div>
    <div class="panel-mock">${c.painel}</div>
    <div class="sub">O que a criança vê</div>
    <div class="kid-mock">${c.crianca}</div>
  </article>`).join('') + `
  <article class="card nao" aria-labelledby="t-ligar">
    <h2 id="t-ligar">Ligar o aparelho</h2>
    <div class="tags"><span class="tag nao">Não é possível</span></div>
    <p class="desc">Um celular desligado não roda o app e não recebe comandos. Por isso não há como ligá-lo remotamente. O mais próximo é acordar a tela, no cartão ao lado.</p>
    <div class="nao-box">Não se aplica.</div>
  </article>`;
</script>
</body>
</html>
