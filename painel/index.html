<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle Infantil — Painel</title>
<style>
  :root {
    --primary: #00695c; --primary-dark: #004d40; --bg: #f4f6f8;
    --card: #ffffff; --text: #263238; --muted: #607d8b; --danger: #c62828;
    --ok: #2e7d32; --border: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    background: var(--primary); color: #fff; padding: 16px 20px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, select {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px;
  }
  button {
    border: none; border-radius: 8px; padding: 12px 14px; font-size: 14px;
    font-weight: 600; cursor: pointer; color: #fff; background: var(--primary);
  }
  button:active { background: var(--primary-dark); }
  button.secondary { background: #455a64; }
  button.danger { background: var(--danger); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .device {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    cursor: pointer;
  }
  .device.selected { border-color: var(--primary); background: #e0f2f1; }
  .muted { color: var(--muted); font-size: 12px; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #263238; color: #fff; padding: 10px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none; }
  a { color: var(--primary); }
</style>
</head>
<body>
<header>
  <span>🛡️</span>
  <h1>Controle Infantil — Painel do responsável</h1>
</header>
<main>

  <!-- Configuração do backend -->
  <div class="card" id="configCard">
    <h2>Conexão</h2>
    <label>URL do Supabase</label>
    <input id="cfgUrl" placeholder="https://SEU-PROJETO.supabase.co" />
    <label>Chave anon</label>
    <input id="cfgKey" placeholder="anon key" />
    <div class="row" style="margin-top:12px">
      <button id="btnSaveCfg">Salvar e conectar</button>
      <span class="muted" id="cfgStatus"></span>
    </div>
  </div>

  <!-- Aparelhos -->
  <div class="card hidden" id="devicesCard">
    <h2>Aparelhos</h2>
    <div id="devicesList"></div>
    <div class="row" style="margin-top:8px">
      <button class="secondary" id="btnRefresh">Atualizar</button>
    </div>
  </div>

  <!-- Comandos -->
  <div class="card hidden" id="commandsCard">
    <h2>Comandos — <span id="selectedLabel"></span></h2>
    <div class="grid">
      <button data-cmd="lock_screen">🔒 Bloquear tela</button>
      <button data-cmd="reboot" class="danger">🔁 Reiniciar</button>
      <button data-cmd="enable_location" class="secondary">🛰️ Ligar GPS</button>
      <button data-cmd="request_location" class="secondary">📍 Pedir localização</button>
    </div>
    <p class="muted" style="margin-top:12px">
      Ver a tela e o check-in de vídeo/áudio aparecem aqui quando essas partes forem
      concluídas (elas mostram o indicador do Android, por transparência).
    </p>
  </div>

  <!-- Última localização -->
  <div class="card hidden" id="locationCard">
    <h2>Última localização</h2>
    <div id="locationInfo" class="muted">—</div>
    <div class="row" style="margin-top:8px">
      <button class="secondary" id="btnLoadLocation">Buscar última posição</button>
    </div>
  </div>

  <!-- Histórico de comandos -->
  <div class="card hidden" id="historyCard">
    <h2>Comandos recentes</h2>
    <div id="historyList" class="muted">—</div>
  </div>

</main>
<div class="toast" id="toast"></div>

<script>
  const els = id => document.getElementById(id);
  const state = { url: '', key: '', devices: [], selected: null };

  function toast(msg) {
    const t = els('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function headers() {
    return {
      'apikey': state.key,
      'Authorization': 'Bearer ' + state.key,
      'Content-Type': 'application/json'
    };
  }

  function rest(path) { return state.url.replace(/\/$/, '') + '/rest/v1/' + path; }

  // ---- Configuração persistida ----
  function loadCfg() {
    state.url = localStorage.getItem('ci_url') || '';
    state.key = localStorage.getItem('ci_key') || '';
    els('cfgUrl').value = state.url;
    els('cfgKey').value = state.key;
    if (state.url && state.key) { connect(); }
  }

  els('btnSaveCfg').onclick = () => {
    state.url = els('cfgUrl').value.trim();
    state.key = els('cfgKey').value.trim();
    localStorage.setItem('ci_url', state.url);
    localStorage.setItem('ci_key', state.key);
    connect();
  };

  async function connect() {
    if (!state.url || !state.key) { toast('Preencha URL e chave'); return; }
    els('cfgStatus').textContent = 'Conectando...';
    try {
      await loadDevices();
      els('cfgStatus').textContent = '✅ conectado';
      els('devicesCard').classList.remove('hidden');
    } catch (e) {
      els('cfgStatus').textContent = '❌ erro: ' + e.message;
    }
  }

  // ---- Aparelhos ----
  async function loadDevices() {
    const resp = await fetch(rest('devices?select=id,label,last_seen&order=last_seen.desc'),
      { headers: headers() });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    state.devices = await resp.json();
    renderDevices();
  }

  function renderDevices() {
    const list = els('devicesList');
    if (!state.devices.length) {
      list.innerHTML = '<p class="muted">Nenhum aparelho ainda. Instale o app no celular da criança e ele aparecerá aqui.</p>';
      return;
    }
    list.innerHTML = '';
    state.devices.forEach(d => {
      const div = document.createElement('div');
      div.className = 'device' + (state.selected === d.id ? ' selected' : '');
      const seen = d.last_seen ? new Date(d.last_seen).toLocaleString('pt-BR') : 'nunca';
      div.innerHTML = `<div><strong>${escapeHtml(d.label)}</strong>
        <div class="muted">visto: ${seen}</div>
        <div class="muted">${d.id}</div></div><span>›</span>`;
      div.onclick = () => selectDevice(d);
      list.appendChild(div);
    });
  }

  function selectDevice(d) {
    state.selected = d.id;
    els('selectedLabel').textContent = d.label;
    els('commandsCard').classList.remove('hidden');
    els('locationCard').classList.remove('hidden');
    els('historyCard').classList.remove('hidden');
    renderDevices();
    loadHistory();
  }

  els('btnRefresh').onclick = loadDevices;

  // ---- Comandos ----
  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.onclick = () => sendCommand(btn.getAttribute('data-cmd'));
  });

  async function sendCommand(type) {
    if (!state.selected) { toast('Escolha um aparelho'); return; }
    const confirmMsg = { reboot: 'Reiniciar o aparelho agora?' }[type];
    if (confirmMsg && !confirm(confirmMsg)) return;
    const resp = await fetch(rest('commands'), {
      method: 'POST',
      headers: { ...headers(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({ device_id: state.selected, type, payload: {} })
    });
    if (resp.ok) { toast('Comando enviado ✅'); setTimeout(loadHistory, 800); }
    else { toast('Erro ao enviar: HTTP ' + resp.status); }
  }

  // ---- Localização ----
  els('btnLoadLocation').onclick = async () => {
    if (!state.selected) { toast('Escolha um aparelho'); return; }
    const resp = await fetch(
      rest(`locations?device_id=eq.${state.selected}&order=created_at.desc&limit=1`),
      { headers: headers() });
    const rows = await resp.json();
    if (!rows.length) { els('locationInfo').textContent = 'Sem localização registrada ainda.'; return; }
    const l = rows[0];
    const when = new Date(l.created_at).toLocaleString('pt-BR');
    els('locationInfo').innerHTML =
      `📍 ${l.lat.toFixed(5)}, ${l.lon.toFixed(5)} (±${Math.round(l.accuracy || 0)}m)<br>
       <span class="muted">${when}</span><br>
       <a href="https://maps.google.com/?q=${l.lat},${l.lon}" target="_blank">Abrir no mapa</a>`;
  };

  // ---- Histórico ----
  async function loadHistory() {
    if (!state.selected) return;
    const resp = await fetch(
      rest(`commands?device_id=eq.${state.selected}&order=created_at.desc&limit=8&select=type,status,created_at,result_detail`),
      { headers: headers() });
    const rows = await resp.json();
    if (!rows.length) { els('historyList').textContent = 'Nenhum comando ainda.'; return; }
    els('historyList').innerHTML = rows.map(r => {
      const when = new Date(r.created_at).toLocaleTimeString('pt-BR');
      const icon = r.status === 'done' ? '✅' : r.status === 'error' ? '⚠️' : '⏳';
      const detail = r.result_detail ? ` — ${escapeHtml(r.result_detail)}` : '';
      return `<div>${icon} <strong>${r.type}</strong> <span class="muted">${when}${detail}</span></div>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  loadCfg();
</script>
</body>
</html>
